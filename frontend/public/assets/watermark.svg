<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Perspective grid pattern -->
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3B82F6" stroke-width="0.4" opacity="0.18"/>
    </pattern>
    <!-- Radial fade mask -->
    <radialGradient id="fade" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="1"/>
      <stop offset="70%"  stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="radialMask">
      <rect width="800" height="450" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Base transparent background -->
  <rect width="800" height="450" fill="transparent"/>

  <!-- Grid layer with radial fade -->
  <g mask="url(#radialMask)">
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>

  <!-- Outer scanning ring -->
  <circle cx="400" cy="225" r="150" fill="none" stroke="#3B82F6" stroke-width="0.7" opacity="0.15"
          stroke-dasharray="6 4"/>
  <circle cx="400" cy="225" r="105" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.12"
          stroke-dasharray="3 6"/>

  <!-- Detection bounding box (centered, pool proportion) -->
  <rect x="260" y="130" width="280" height="188"
        fill="none" stroke="#3B82F6" stroke-width="1.2" opacity="0.22" rx="2"/>

  <!-- Corner brackets on the bounding box -->
  <!-- top-left -->
  <path d="M260 157 L260 130 L287 130" fill="none" stroke="#60A5FA" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
  <!-- top-right -->
  <path d="M513 130 L540 130 L540 157" fill="none" stroke="#60A5FA" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
  <!-- bottom-left -->
  <path d="M260 291 L260 318 L287 318" fill="none" stroke="#60A5FA" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>
  <!-- bottom-right -->
  <path d="M540 291 L540 318 L513 318" fill="none" stroke="#60A5FA" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>

  <!-- Crosshair -->
  <line x1="400" y1="200" x2="400" y2="250" stroke="#3B82F6" stroke-width="0.8" opacity="0.22"/>
  <line x1="375" y1="225" x2="425" y2="225" stroke="#3B82F6" stroke-width="0.8" opacity="0.22"/>
  <circle cx="400" cy="225" r="8" fill="none" stroke="#3B82F6" stroke-width="0.9" opacity="0.22"/>
  <circle cx="400" cy="225" r="2" fill="#3B82F6" opacity="0.18"/>

  <!-- Person silhouette (swimmer outline) -->
  <g opacity="0.10" transform="translate(400,225)">
    <!-- head -->
    <circle cx="0" cy="-48" r="11" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- body -->
    <line x1="0" y1="-37" x2="0" y2="-5" stroke="#60A5FA" stroke-width="1.5"/>
    <!-- arms (horizontal – swimming pose) -->
    <path d="M-28,-22 Q-14,-20 0,-22 Q14,-20 28,-22" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M0,-5 Q-8,8 -14,18" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0,-5 Q8,8 14,18" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Water wave lines (pool surface) -->
  <g opacity="0.10">
    <path d="M90 360 Q140 352 190 360 Q240 368 290 360 Q340 352 390 360 Q440 368 490 360 Q540 352 590 360 Q640 368 690 360 Q715 354 720 360"
          fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M90 372 Q140 364 190 372 Q240 380 290 372 Q340 364 390 372 Q440 380 490 372 Q540 364 590 372 Q640 380 690 372 Q715 366 720 372"
          fill="none" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- "POOLGUARD" watermark text -->
  <text x="400" y="408"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="7"
        fill="#3B82F6" opacity="0.18"
        text-anchor="middle" dominant-baseline="middle">
    POOLGUARD  •  AI DROWNING DETECTION
  </text>

  <!-- "DDS" secondary label -->
  <text x="400" y="424"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="4"
        fill="#60A5FA" opacity="0.12"
        text-anchor="middle" dominant-baseline="middle">
    SURVEILLANCE SYSTEM  v5
  </text>

  <!-- Scan-line accent (top/bottom) -->
  <line x1="60"  y1="40" x2="200" y2="40" stroke="#3B82F6" stroke-width="0.5" opacity="0.14"/>
  <line x1="600" y1="40" x2="740" y2="40" stroke="#3B82F6" stroke-width="0.5" opacity="0.14"/>
  <line x1="60"  y1="50" x2="160" y2="50" stroke="#3B82F6" stroke-width="0.3" opacity="0.10"/>
  <line x1="640" y1="50" x2="740" y2="50" stroke="#3B82F6" stroke-width="0.3" opacity="0.10"/>
</svg>
