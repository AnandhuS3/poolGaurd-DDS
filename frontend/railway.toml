# =============================================================================
# Railway service config — Frontend (React / Vite)
# =============================================================================
# Set "Root Directory" to /frontend in Railway service settings.
# Set VITE_API_URL to your deployed backend URL as a Service Variable:
#   e.g. https://your-backend.up.railway.app

[build]
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
