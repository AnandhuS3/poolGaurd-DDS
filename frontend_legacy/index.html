<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PoolGuard • Real-time Drowning Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #f8f9fc;
      --bg-card: #ffffff;
      --primary: #4361ee;
      --primary-dark: #3f37c9;
      --danger: #e63946;
      --warning: #fb8500;
      --safe: #2dc653;
      --land: #4e79a7;
      --text: #1d3557;
      --text-light: #64748b;
      --border: #e0e4ed;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.07);
      --shadow-md: 0 6px 24px rgba(0, 0, 0, 0.11);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app-container {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.8rem;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-content {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo-title {
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .input-group {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="file"],
    input[type="text"] {
      padding: 0.68rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.94rem;
      background: white;
      min-width: 220px;
      max-width: 420px;
    }

    input[type="file"] {
      padding: 0.6rem;
    }

    .btn {
      padding: 0.68rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.07);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    main {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 0.8fr) minmax(320px, 1fr);
      gap: 1.6rem;
      padding: 1.6rem 1.8rem;
      height: 100%;
      overflow: hidden;
    }

    .video-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-main-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-wrapper {
      background: black;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      flex: 1;
      min-height: 0;
      box-shadow: var(--shadow-md);
    }

    .video-wrapper-side {
      background: black;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 240px;
      box-shadow: var(--shadow-md);
    }

    #videoCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: #000;
      display: none;
      z-index: 1;
    }

    #frameCanvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      background: #000;
      z-index: 1;
    }

    .frame-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      z-index: 10;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #9ca3af;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #1e293b 0%, #111827 100%);
      text-align: center;
      padding: 2.5rem;
      z-index: 2;
    }

    .placeholder h3 {
      margin-bottom: 0.8rem;
      color: white;
      font-size: 1.5rem;
    }

    .controls-bar {
      background: white;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .middle-panel {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      overflow-y: auto;
    }

    .right-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      overflow-y: auto;
      padding-right: 0.4rem;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.3rem;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.05rem;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1.2rem;
    }

    .status-tile {
      padding: 1rem;
      border-radius: 10px;
      background: #f8fafc;
      text-align: center;
    }

    .status-tile .value {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0.4rem 0 0.2rem;
    }

    .status-tile .label {
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .person-list {
      padding: 1rem;
      flex: 1;
      overflow-y: auto;
    }

    .person-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .person-id {
      font-weight: 600;
    }

    .status-safe {
      color: var(--safe);
      font-weight: 500;
    }

    .status-danger {
      color: var(--danger);
      font-weight: 500;
    }

    .event-log {
      padding: 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .event-item {
      padding: 0.7rem 1rem;
      border-left: 4px solid var(--warning);
      background: #fffbeb;
      margin-bottom: 0.6rem;
      border-radius: 6px;
      font-size: 0.92rem;
    }

    .event-danger {
      border-color: var(--danger);
      background: #fee2e2;
    }

    .event-time {
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .report-section {
      padding: 1rem;
      font-size: 0.9rem;
      overflow-y: auto;
      flex: 1;
    }

    .report-item {
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .report-item:last-child {
      border-bottom: none;
    }

    .report-label {
      color: var(--text-light);
      font-size: 0.85rem;
    }

    .report-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 0.2rem;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.4rem;
      vertical-align: middle;
    }

    .status-indicator.safe {
      background: var(--safe);
    }

    .status-indicator.warning {
      background: var(--warning);
    }

    .status-indicator.danger {
      background: var(--danger);
    }

    /* Mute Alarm Button */
    .mute-alarm-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      backdrop-filter: blur(10px);
    }

    .mute-alarm-btn:hover {
      transform: scale(1.1);
      background: rgba(220, 38, 38, 1);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }

    .mute-alarm-btn:active {
      transform: scale(0.95);
    }

    .mute-alarm-btn.muted {
      background: rgba(107, 114, 128, 0.95);
      box-shadow: 0 4px 12px rgba(107, 114, 128, 0.4);
    }

    .mute-alarm-btn.muted:hover {
      background: rgba(75, 85, 99, 1);
      box-shadow: 0 6px 20px rgba(107, 114, 128, 0.6);
    }

    .mute-alarm-btn .tooltip {
      position: absolute;
      top: 50%;
      right: calc(100% + 10px);
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .mute-alarm-btn:hover .tooltip {
      opacity: 1;
    }

    /* Responsive Design */
    @media (min-width: 1600px) {
      main {
        grid-template-columns: minmax(900px, 4fr) minmax(420px, 1fr);
        max-width: 2400px;
        margin: 0 auto;
      }
    }

    @media (max-width: 1400px) {
      main {
        grid-template-columns: 1fr minmax(280px, 0.7fr);
        gap: 1.2rem;
      }

      .right-sidebar {
        display: none;
      }
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        gap: 1.2rem;
      }

      .video-wrapper {
        min-height: 480px;
      }

      .middle-panel {
        display: none;
      }

      .right-sidebar {
        display: flex;
      }
    }

    @media (max-width: 1200px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .video-wrapper {
        min-height: 480px;
      }

      .right-sidebar {
        max-height: 48vh;
      }
    }

    @media (max-width: 768px) {

      .header-content,
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }

      input[type="text"],
      input[type="file"] {
        max-width: none;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <header>
      <div class="header-content">
        <div class="logo-title">PoolGuard</div>
        <div class="input-group">
          <input type="file" id="videoFile" accept="video/*" />
          <input type="text" id="youtubeUrl" placeholder="YouTube / direct video URL" />
          <button class="btn btn-primary" id="startBtn">
            Start Analysis
          </button>
          <button class="btn btn-danger" id="stopBtn" disabled>Stop</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
      </div>
    </header>
    <main>
      <div class="video-main-wrapper">
        <div class="video-wrapper">
          <div class="placeholder" id="placeholder">
            <h3>No Video Loaded</h3>
            <p>
              Upload a video file or paste a link to begin real-time
              monitoring
            </p>
          </div>
          <div class="frame-label" id="frameLabel"
            style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 0.5rem 1rem; border-radius: 6px; color: white; font-weight: 600; font-size: 0.9rem;">
            Frame: 0</div>

          <!-- Mute Alarm Button -->
          <button class="mute-alarm-btn" id="muteAlarmBtn" title="Mute/Unmute Alarm">
            <span id="muteAlarmIcon">🔊</span>
            <span class="tooltip" id="muteAlarmTooltip">Mute Alarm</span>
          </button>
          <canvas id="frameCanvas"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100%; width: auto; height: auto; background: #000; display: none;"></canvas>
        </div>
        <div class="controls-bar" id="controlsBar">
          Processing: <span id="processStatus">Idle</span> | Frame: <span id="frameInfo">0/0</span>
        </div>
      </div>

      <div class="middle-panel">
        <div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 300px;">
          <div class="card-header">Original Video</div>
          <div class="video-wrapper-side">
            <video id="videoElement"
              style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100%; width: auto; height: auto; background: #000; display: none;"
              controls autoplay muted></video>
          </div>
          <div style="padding: 1rem; flex: 1; overflow-y: auto; font-size: 0.9rem;">
            <div id="frameStats">
              <div style="color: var(--text-light);">Waiting for video...</div>
            </div>
          </div>
        </div>

        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
          <div class="card-header">Pool Status</div>
          <div class="status-grid">
            <div class="status-tile">
              <div class="value" id="totalPersons">0</div>
              <div class="label">Persons</div>
            </div>
            <div class="status-tile">
              <div class="value" id="drowningAlerts">0</div>
              <div class="label">Alerts</div>
            </div>
          </div>
        </div>
      </div>

      <div class="right-sidebar">
        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
          <div class="card-header">Tracked Persons</div>
          <div class="person-list" id="personList"></div>
        </div>

        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
          <div class="card-header">Analysis Report</div>
          <div class="report-section" id="reportSection">
            <div style="text-align: center; color: var(--text-light); padding: 2rem;">
              No data yet
            </div>
          </div>
        </div>

        <div class="card" style="flex: 1; display: flex; flex-direction: column;">
          <div class="card-header">Event Log</div>
          <div class="event-log" id="eventLog"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- AUDIO ALERT - Drowning alarm sound -->
  <audio id="alarmSound" preload="auto">
    <source src="/sounds/alarm.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ========================================================================
    // AUTHENTICATION CHECK
    // ========================================================================
    const authToken = localStorage.getItem('auth_token');
    const userInfo = localStorage.getItem('user_info');

    // Redirect to login if not authenticated
    if (!authToken || !userInfo) {
      window.location.href = '/login';
    }

    // Parse user info
    let currentUser = null;
    try {
      currentUser = JSON.parse(userInfo);
    } catch (e) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_info');
      window.location.href = '/login';
    }

    // Add authentication headers to fetch requests
    const authenticatedFetch = (url, options = {}) => {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${authToken}`;
      return fetch(url, options).then(response => {
        if (response.status === 401) {
          // Token expired or invalid
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_info');
          window.location.href = '/login';
          throw new Error('Authentication required');
        }
        return response;
      });
    };

    // Add user info to page header
    window.addEventListener('DOMContentLoaded', () => {
      const headerContent = document.querySelector('.header-content');
      if (headerContent && currentUser) {
        const userBadge = document.createElement('div');
        userBadge.style.cssText = 'display: flex; align-items: center; gap: 1rem; margin-left: auto;';
        userBadge.innerHTML = `
          <span style="color: #64748b; font-size: 0.9rem;">
            👤 ${currentUser.name} 
            <span style="background: #4361ee; color: white; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; margin-left: 0.5rem;">
              ${currentUser.role.toUpperCase()}
            </span>
          </span>
          ${currentUser.role === 'admin' ? '<button class="btn btn-primary" onclick="window.location.href=\'/admin\'" style="font-size: 0.9rem; padding: 0.5rem 1rem;">Admin Panel</button>' : ''}
          <button class="btn" onclick="logout()" style="background: #e63946; color: white; font-size: 0.9rem; padding: 0.5rem 1rem;">Logout</button>
        `;
        headerContent.appendChild(userBadge);
      }
    });

    // Logout function
    function logout() {
      authenticatedFetch('/api/auth/logout', { method: 'POST' })
        .finally(() => {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('user_info');
          window.location.href = '/login';
        });
    }

    // ========================================================================
    // MAIN APPLICATION CODE
    // ========================================================================

    // Elements
    const els = {
      videoFile: document.getElementById("videoFile"),
      youtubeUrl: document.getElementById("youtubeUrl"),
      startBtn: document.getElementById("startBtn"),
      stopBtn: document.getElementById("stopBtn"),
      resetBtn: document.getElementById("resetBtn"),
      placeholder: document.getElementById("placeholder"),
      canvas: document.getElementById("videoCanvas"),
      frameCanvas: document.getElementById("frameCanvas"),
      frameLabel: document.getElementById("frameLabel"),
      video: document.getElementById("videoElement"),
      processStatus: document.getElementById("processStatus"),
      frameInfo: document.getElementById("frameInfo"),
      frameStats: document.getElementById("frameStats"),
      totalPersons: document.getElementById("totalPersons"),
      drowningAlerts: document.getElementById("drowningAlerts"),
      personList: document.getElementById("personList"),
      reportSection: document.getElementById("reportSection"),
      eventLog: document.getElementById("eventLog"),
      alarmSound: document.getElementById("alarmSound"),  // AUDIO ALERT
      muteAlarmBtn: document.getElementById("muteAlarmBtn"),  // MUTE BUTTON
      muteAlarmIcon: document.getElementById("muteAlarmIcon"),  // MUTE ICON
      muteAlarmTooltip: document.getElementById("muteAlarmTooltip")  // TOOLTIP
    };

    // Variables
    let isProcessing = false;
    let videoScale = { x: 1, y: 1, offsetX: 0, offsetY: 0 };
    let analysisResults = null;
    let websocket = null;
    let reconnectAttempts = 0;
    let maxReconnectAttempts = 5;
    let reconnectDelay = 2000; // Start with 2 seconds
    let uploadedFilePath = null;
    let uploadedVideoUrl = null;
    let currentFrameData = null;

    // AUDIO ALERT - Track which persons have triggered alarm (prevent replay)
    let alarmTriggeredForPerson = new Set();
    let isAlarmMuted = false;  // Track mute state

    // MUTE ALARM BUTTON - Toggle mute/unmute
    function toggleAlarmMute() {
      isAlarmMuted = !isAlarmMuted;

      if (isAlarmMuted) {
        // Mute alarm
        els.alarmSound.pause();
        els.alarmSound.currentTime = 0;
        els.muteAlarmBtn.classList.add('muted');
        els.muteAlarmIcon.textContent = '🔇';
        els.muteAlarmTooltip.textContent = 'Unmute Alarm';
        addEventLog('🔇 Alarm muted', 'info');
        console.log('[ALARM] Muted');
      } else {
        // Unmute alarm
        els.muteAlarmBtn.classList.remove('muted');
        els.muteAlarmIcon.textContent = '🔊';
        els.muteAlarmTooltip.textContent = 'Mute Alarm';
        addEventLog('🔊 Alarm unmuted', 'info');
        console.log('[ALARM] Unmuted');
      }
    }

    // Add click listener to mute button
    if (els.muteAlarmBtn) {
      els.muteAlarmBtn.addEventListener('click', toggleAlarmMute);
    }

    let videoMetadata = {
      fps: 0,
      totalFrames: 0,
      width: 0,
      height: 0,
      duration: 0
    };
    let reportData = {
      totalPersons: 0,
      drowningIncidents: 0,
      warningIncidents: 0,
      analysisTime: 0,
      personDetails: {}
    };
    const serverUrl = "http://localhost:8000";
    const wsUrl = "ws://localhost:8000";

    // Resize canvas to fit container
    function resizeCanvasToFit() {
      const container = document.querySelector(".video-wrapper");
      if (!container) return;

      // Update canvas display size - check if elements exist
      if (els.canvas && els.canvas.style) {
        els.canvas.style.width = "100%";
        els.canvas.style.height = "100%";
        els.canvas.style.objectFit = "contain";
      }

      if (els.frameCanvas && els.frameCanvas.style) {
        els.frameCanvas.style.width = "100%";
        els.frameCanvas.style.height = "100%";
        els.frameCanvas.style.objectFit = "contain";
      }
    }

    // Draw frame from base64 data
    function drawFrameFromBase64(base64Data, targetCanvas = els.frameCanvas) {
      if (!base64Data) {
        console.warn('No base64 data provided for canvas');
        return;
      }

      const img = new Image();
      img.onload = function () {
        const ctx = targetCanvas.getContext("2d");
        // Only resize canvas once or when dimensions change
        if (targetCanvas.width !== img.width || targetCanvas.height !== img.height) {
          targetCanvas.width = img.width;
          targetCanvas.height = img.height;
          console.log(`Canvas resized to ${img.width}x${img.height}`);
        }
        ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        ctx.drawImage(img, 0, 0);
      };
      img.onerror = function () {
        console.error('Failed to load frame image');
      };
      img.src = "data:image/jpeg;base64," + base64Data;
    }

    // Update frame analysis display
    function updateFrameAnalysis(data) {
      currentFrameData = data;

      // Draw analysis frame with annotations on main canvas (large display)
      const analysisFrame = data.analysis_frame || data.frame;
      if (analysisFrame) {
        drawFrameFromBase64(analysisFrame, els.frameCanvas);
        // Show the canvas on first frame
        if (els.frameCanvas.style.display === 'none') {
          els.frameCanvas.style.display = 'block';
          els.placeholder.style.display = 'none';
        }
      } else {
        console.warn('No analysis frame received');
      }

      // Update frame label
      els.frameLabel.textContent = `Frame: ${data.frame_number}/${data.total_frames}`;
      els.frameInfo.textContent = `${data.frame_number}/${data.total_frames}`;

      // Update frame stats with performance metrics
      let statsHTML = `
          <div class="report-item">
            <div class="report-label">Frame Info</div>
            <div class="report-value">${data.frame_number}/${data.total_frames}</div>
          </div>`;

      // Add performance metrics if available
      if (data.performance) {
        const perf = data.performance;
        const isRealtime = perf.real_time ? '✓' : '✗';
        const realtimeColor = perf.real_time ? 'var(--safe)' : 'var(--warning)';
        statsHTML += `
          <div class="report-item">
            <div class="report-label">Processing Speed</div>
            <div class="report-value">${perf.processing_fps} FPS (${perf.speed_ratio}x) <span style="color: ${realtimeColor};">${isRealtime}</span></div>
          </div>`;
      }

      statsHTML += `
          <div class="report-item">
            <div class="report-label">Persons in Frame</div>
            <div class="report-value">${data.persons ? data.persons.length : 0}</div>
          </div>`;

      if (data.persons && data.persons.length > 0) {
        statsHTML += '<div class="report-item"><div class="report-label">Detected Persons</div>';
        data.persons.forEach(p => {
          const indicator = `<span class="status-indicator ${p.status}"></span>`;
          statsHTML += `<div style="margin: 0.3rem 0;">${indicator}#${p.id}: ${p.status.toUpperCase()}</div>`;
        });
        statsHTML += '</div>';
      }

      els.frameStats.innerHTML = statsHTML;
    }

    // Update analysis report
    function updateAnalysisReport(data) {
      if (!data) return;

      let reportHTML = `
          <div class="report-item">
            <div class="report-label">Total Persons Detected</div>
            <div class="report-value">${reportData.totalPersons}</div>
          </div>
          <div class="report-item">
            <div class="report-label">Drowning Alerts</div>
            <div class="report-value" style="color: ${reportData.drowningIncidents > 0 ? 'var(--danger)' : 'var(--safe)'};">
              ${reportData.drowningIncidents}
            </div>
          </div>
          <div class="report-item">
            <div class="report-label">Warning Cases</div>
            <div class="report-value" style="color: var(--warning);">
              ${reportData.warningIncidents}
            </div>
          </div>`;

      if (videoMetadata.fps > 0) {
        reportHTML += `
            <div class="report-item">
              <div class="report-label">Video FPS</div>
              <div class="report-value">${videoMetadata.fps}</div>
            </div>`;
      }

      // Add person details
      const personIds = Object.keys(reportData.personDetails);
      if (personIds.length > 0) {
        reportHTML += '<div class="report-item"><div class="report-label">Person Summary</div>';
        personIds.forEach(id => {
          const details = reportData.personDetails[id];
          reportHTML += `<div style="margin: 0.4rem 0; font-size: 0.85rem;">
              Person #${id}: ${details.status || 'Unknown'} (${details.frames || 0} frames)
            </div>`;
        });
        reportHTML += '</div>';
      }

      els.reportSection.innerHTML = reportHTML;
    }

    // Connect to WebSocket with automatic reconnection
    function connectWebSocket() {
      if (websocket && websocket.readyState === WebSocket.OPEN) {
        return websocket;
      }

      // Include authentication token in WebSocket URL
      websocket = new WebSocket(`${wsUrl}/ws/process?token=${authToken}`);

      websocket.onopen = () => {
        console.log("WebSocket connected");
        reconnectAttempts = 0; // Reset on successful connection
        reconnectDelay = 2000;
        els.processStatus.textContent = "Connected";
      };

      websocket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('WebSocket message received:', data.type, data);
        handleWebSocketMessage(data);
      };

      websocket.onerror = (error) => {
        console.error("WebSocket error:", error);
        els.processStatus.textContent = "Connection Error";
      };

      websocket.onclose = (event) => {
        console.log("WebSocket closed", event.code, event.reason);

        // Only attempt reconnection if processing was active
        if (isProcessing && reconnectAttempts < maxReconnectAttempts) {
          reconnectAttempts++;
          const delay = reconnectDelay * Math.pow(1.5, reconnectAttempts - 1); // Exponential backoff

          els.processStatus.textContent = `Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`;
          addEventLog(`⚠️ Connection lost. Reconnecting in ${delay / 1000}s...`, "warning");

          setTimeout(() => {
            console.log(`Reconnection attempt ${reconnectAttempts}`);
            connectWebSocket();

            // Re-send video path if we have it
            if (uploadedFilePath && websocket.readyState === WebSocket.OPEN) {
              websocket.send(JSON.stringify({ video_path: uploadedFilePath }));
            }
          }, delay);
        } else {
          isProcessing = false;
          els.stopBtn.disabled = true;
          els.startBtn.disabled = false;

          if (reconnectAttempts >= maxReconnectAttempts) {
            addEventLog("❌ Connection failed after multiple attempts", "danger");
            els.processStatus.textContent = "Connection Failed";
          }
        }
      };

      return websocket;
    }

    // Handle WebSocket messages
    function handleWebSocketMessage(data) {
      console.log('[WS MESSAGE] Type:', data.type); // Log all message types

      switch (data.type) {
        case "video_info":
          console.log("Video info:", data);
          videoMetadata = {
            fps: data.fps,
            totalFrames: data.total_frames,
            width: data.width,
            height: data.height,
            duration: data.total_frames / data.fps
          };
          els.processStatus.textContent = `Processing (${data.fps} FPS) - Duration: ${Math.round(videoMetadata.duration)}s`;
          addEventLog(`📹 Video loaded: ${data.width}x${data.height} @ ${data.fps}fps`, "info");
          break;

        // WARNING SYSTEM - Handle state change events
        case "state_change":
          console.log('[WS] ⚠️ STATE_CHANGE message received!', data);
          handleStateChange(data);
          break;

        case "frame":
          // Only update analysis frame (main video plays natively)
          console.log('Received frame:', data.frame_number, 'Persons:', data.persons?.length || 0);
          updateFrameAnalysis(data);

          // Update persons list
          if (data.persons) {
            updatePersonsList(data.persons);
          }

          // Update summary
          if (data.summary) {
            els.totalPersons.textContent = data.summary.total;
            els.drowningAlerts.textContent = data.summary.alerts;

            // Update report data
            reportData.totalPersons = data.summary.total;
            reportData.drowningIncidents = data.summary.danger;
            reportData.warningIncidents = data.summary.warning;
          }

          // Check for alerts and log them
          if (data.persons) {
            data.persons.forEach((person) => {
              if (person.alert && person.status === "danger") {
                addEventLog(
                  `⚠️ DROWNING ALERT: Person #${person.id}`,
                  "danger"
                );
              }
            });
          }

          // Update report periodically
          if (data.frame_number % 30 === 0) {
            updateAnalysisReport(data);
          }
          break;

        case "complete":
          console.log("Processing complete:", data);
          els.processStatus.textContent = "✓ Complete";

          // Update report data with final results
          if (data.person_data) {
            reportData.personDetails = {};
            Object.entries(data.person_data).forEach(([key, value]) => {
              const personId = key.replace('person_', '');
              reportData.personDetails[personId] = value;
            });
          }

          updateAnalysisReport(null);
          addEventLog("✓ Video processing completed", "success");
          isProcessing = false;
          els.stopBtn.disabled = true;
          els.startBtn.disabled = false;
          break;

        case "error":
          console.error("Server error:", data.message);
          els.processStatus.textContent = "Error: " + data.message;
          addEventLog("❌ Error: " + data.message, "danger");
          isProcessing = false;
          els.stopBtn.disabled = true;
          els.startBtn.disabled = false;
          break;
      }
    }

    // Update persons list in sidebar
    function updatePersonsList(persons) {
      els.personList.innerHTML = "";

      if (persons.length === 0) {
        els.personList.innerHTML =
          '<div style="text-align:center;color:#9ca3af;padding:2rem;">No persons detected</div>';
        return;
      }

      persons.forEach((person) => {
        const row = document.createElement("div");
        row.className = "person-row";
        const indicator = `<span class="status-indicator ${person.status}"></span>`;
        row.innerHTML = `
          <span class="person-id">${indicator}Person #${person.id}</span>
          <span class="status-${person.status
          }">${person.status.toUpperCase()}</span>
        `;
        els.personList.appendChild(row);
      });
    }

    // Add event to log
    const eventLogCache = new Set();

    // WARNING SYSTEM - Handle state change events
    function handleStateChange(data) {
      console.log('[STATE CHANGE RECEIVED]', JSON.stringify(data));
      console.log('[DEBUG] alarmSound element:', els.alarmSound);
      console.log('[DEBUG] alarmTriggeredForPerson:', Array.from(alarmTriggeredForPerson));

      // Support both 'person_id' (from backend) and 'track_id' (legacy)
      const track_id = data.track_id || data.person_id;
      const state = data.state || data.new_state;
      const previous_state = data.previous_state || data.old_state;

      if (!track_id || !state) {
        console.error('[STATE CHANGE ERROR] Missing required fields:', data);
        return;
      }

      // Log state change
      let logType = "info";
      let icon = "🔵";

      if (state === "WARNING") {
        logType = "warning";
        icon = "⚠️";
      } else if (state === "DANGER") {
        logType = "danger";
        icon = "🚨";
      } else if (state === "SAFE") {
        icon = "✅";
      }

      addEventLog(
        `${icon} Person #${track_id}: ${previous_state || 'UNKNOWN'} → ${state}`,
        logType
      );

      // AUDIO ALERT - Play alarm sound when person enters WARNING or DANGER state
      if (state === "WARNING" || state === "DANGER") {
        console.log(`[AUDIO CHECK] State is ${state}, should play alarm`);

        // Only play alarm once per person per state
        const alarmKey = `${track_id}_${state}`;
        console.log(`[AUDIO CHECK] Alarm key: ${alarmKey}`);
        console.log(`[AUDIO CHECK] Already triggered:`, alarmTriggeredForPerson.has(alarmKey));

        if (!alarmTriggeredForPerson.has(alarmKey)) {
          alarmTriggeredForPerson.add(alarmKey);
          console.log(`[AUDIO TRIGGER] Attempting to play alarm for ${alarmKey}`);

          // Play alarm sound
          try {
            if (!els.alarmSound) {
              console.error('[AUDIO ERROR] alarmSound element not found!');
              return;
            }

            // Check if alarm is muted
            if (isAlarmMuted) {
              console.log(`[AUDIO MUTED] Alarm is muted, skipping sound for Person #${track_id} - ${state}`);
              addEventLog(`🔇 ALARM MUTED: ${state} alert for Person #${track_id}`, logType);
              return;
            }

            console.log('[AUDIO] Setting currentTime to 0');
            els.alarmSound.currentTime = 0; // Reset to start

            console.log('[AUDIO] Calling play()');
            const playPromise = els.alarmSound.play();

            if (playPromise !== undefined) {
              playPromise.then(() => {
                console.log(`[AUDIO SUCCESS] ✅ Alarm played for Person #${track_id} - ${state}`);
                addEventLog(`🔊 ALARM: ${state} alert for Person #${track_id}`, logType);
              }).catch(err => {
                console.error('[AUDIO ERROR] Could not play alarm sound:', err);
                // Browser may block autoplay - show visual alert
                addEventLog('🔊 ALARM BLOCKED: Click page to enable sound!', 'danger');
              });
            }
          } catch (err) {
            console.error('[AUDIO EXCEPTION] Error playing alarm:', err);
          }
        } else {
          console.log(`[AUDIO SKIP] Alarm already triggered for ${alarmKey}`);
        }
      } else {
        console.log(`[AUDIO CHECK] State is ${state}, no alarm needed`);
      }
    }

    function addEventLog(message, type = "info") {
      // Prevent duplicate alerts within 2 seconds
      const cacheKey = message + type;
      if (eventLogCache.has(cacheKey)) return;
      eventLogCache.add(cacheKey);

      // Clear cache after 2 seconds
      setTimeout(() => eventLogCache.delete(cacheKey), 2000);

      const event = document.createElement("div");
      event.className = "event-item";
      if (type === "danger") event.classList.add("event-danger");

      const time = new Date().toLocaleTimeString();
      event.innerHTML = `
        ${message}<br>
        <span class="event-time">${time}</span>
      `;

      els.eventLog.insertBefore(event, els.eventLog.firstChild);

      // Keep only last 30 events
      while (els.eventLog.children.length > 30) {
        els.eventLog.removeChild(els.eventLog.lastChild);
      }
    }

    // Handle start analysis
    async function startAnalysis() {
      if (isProcessing) return;

      els.startBtn.disabled = true;
      els.stopBtn.disabled = false;
      els.processStatus.textContent = "Uploading...";

      try {
        let response;

        // Step 1: Upload video (with authentication)
        if (els.videoFile.files.length > 0) {
          const formData = new FormData();
          formData.append("file", els.videoFile.files[0]);
          response = await authenticatedFetch(`${serverUrl}/analyze/upload`, {
            method: "POST",
            body: formData,
          });
        } else if (els.youtubeUrl.value.trim()) {
          response = await authenticatedFetch(`${serverUrl}/analyze/youtube`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: els.youtubeUrl.value }),
          });
        } else {
          throw new Error("No video file or URL provided");
        }

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || "Upload failed");
        }

        const uploadData = await response.json();
        uploadedFilePath = uploadData.filepath;
        uploadedVideoUrl = uploadData.video_url;

        addEventLog("✓ Video uploaded successfully", "success");

        // Step 2: Load video in native HTML5 video player
        const videoUrl = uploadedVideoUrl.startsWith('http') ? uploadedVideoUrl : `${serverUrl}${uploadedVideoUrl}`;
        console.log('Loading video from:', videoUrl);
        els.video.src = videoUrl;
        els.video.load(); // Force reload
        els.video.style.display = "block";
        els.placeholder.style.display = "none";

        // Wait for video metadata to load
        await new Promise((resolve, reject) => {
          els.video.onloadedmetadata = () => {
            console.log('Video metadata loaded:', {
              width: els.video.videoWidth,
              height: els.video.videoHeight,
              duration: els.video.duration
            });
            resolve();
          };
          els.video.onerror = (e) => {
            console.error('Video load error:', e, 'URL:', videoUrl);
            const errorMsg = els.video.error ?
              `Video error (code ${els.video.error.code}): ${els.video.error.message}` :
              'Failed to load video';
            addEventLog(`❌ ${errorMsg}`, 'danger');
            reject(new Error(errorMsg));
          };
          setTimeout(() => reject(new Error("Video load timeout")), 10000);
        });

        videoMetadata = {
          fps: 30, // Default, will be updated from server
          totalFrames: Math.floor(els.video.duration * 30),
          width: els.video.videoWidth,
          height: els.video.videoHeight,
          duration: els.video.duration
        };

        addEventLog(`📹 Video loaded: ${videoMetadata.width}x${videoMetadata.height}`, "info");
        els.processStatus.textContent = "Connecting to analysis...";

        // Step 3: Connect to WebSocket for ML analysis
        const ws = connectWebSocket();

        // Wait for connection
        await new Promise((resolve, reject) => {
          if (ws.readyState === WebSocket.OPEN) {
            resolve();
          } else {
            ws.onopen = resolve;
            ws.onerror = reject;
            setTimeout(() => reject(new Error("Connection timeout")), 5000);
          }
        });

        // Step 4: Start both video playback and ML processing simultaneously
        isProcessing = true;
        els.processStatus.textContent = "Starting analysis...";

        // Start ML analysis via WebSocket first
        console.log('Sending video path to WebSocket:', uploadedFilePath);
        ws.send(
          JSON.stringify({
            video_path: uploadedFilePath,
          })
        );

        // Wait a moment for analysis to start, then play video
        await new Promise(resolve => setTimeout(resolve, 500));

        // Start native video playback
        els.video.play();
        els.processStatus.textContent = "Processing...";

        addEventLog("🎬 Video playback and analysis started", "info");
      } catch (error) {
        console.error('Start analysis error:', error);
        alert("Error: " + error.message);
        els.processStatus.textContent = "Error";
        els.startBtn.disabled = false;
        els.stopBtn.disabled = true;
        isProcessing = false;
      }
    }

    // Stop processing
    function stopProcessing() {
      if (!isProcessing) return;

      if (websocket && websocket.readyState === WebSocket.OPEN) {
        websocket.close();
      }

      isProcessing = false;
      els.stopBtn.disabled = true;
      els.startBtn.disabled = false;
      els.processStatus.textContent = "Stopped";
      addEventLog("⏸️ Processing stopped", "info");
    }

    // Reset everything
    function resetApp() {
      stopProcessing();

      if (websocket) {
        websocket.close();
        websocket = null;
      }

      // Stop and clear video
      els.video.pause();
      els.video.src = "";
      els.video.style.display = 'none';

      // Clear analysis canvas
      const frameCtx = els.frameCanvas.getContext("2d");
      frameCtx.clearRect(0, 0, els.frameCanvas.width, els.frameCanvas.height);
      els.frameCanvas.style.display = 'none';

      els.placeholder.style.display = "flex";
      els.videoFile.value = "";
      els.youtubeUrl.value = "";
      uploadedFilePath = null;
      uploadedVideoUrl = null;
      els.totalPersons.textContent = "0";
      els.drowningAlerts.textContent = "0";
      els.frameInfo.textContent = "0/0";
      els.personList.innerHTML = "";
      els.eventLog.innerHTML = "";
      els.reportSection.innerHTML = '<div style="text-align: center; color: var(--text-light); padding: 2rem;">No data yet</div>';
      els.frameStats.innerHTML = '<div style="color: var(--text-light);">Waiting for video...</div>';
      els.processStatus.textContent = "Idle";
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
      uploadedFilePath = null;
      currentFrameData = null;

      // AUDIO ALERT - Reset alarm tracking
      alarmTriggeredForPerson.clear();
      els.alarmSound.pause();
      els.alarmSound.currentTime = 0;

      reportData = {
        totalPersons: 0,
        drowningIncidents: 0,
        warningIncidents: 0,
        analysisTime: 0,
        personDetails: {}
      };
      eventLogCache.clear();

      addEventLog("🔄 System reset", "info");
    }

    // Debounce function
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Event listeners
    // AUDIO FIX - Enable audio on first user interaction
    let audioInitialized = false;
    function initializeAudio() {
      if (!audioInitialized && els.alarmSound) {
        // Load and prepare audio element
        els.alarmSound.load();
        // Try to play and immediately pause to unlock audio
        els.alarmSound.play().then(() => {
          els.alarmSound.pause();
          els.alarmSound.currentTime = 0;
          audioInitialized = true;
          console.log('[AUDIO] Audio initialized and ready');
          addEventLog('🔊 Audio enabled', 'info');
        }).catch(err => {
          console.log('[AUDIO] Audio will be enabled on next interaction:', err.message);
        });
      }
    }

    els.startBtn.addEventListener("click", () => {
      initializeAudio();
      startAnalysis();
    });
    els.stopBtn.addEventListener("click", stopProcessing);
    els.resetBtn.addEventListener("click", resetApp);
    window.addEventListener("resize", debounce(resizeCanvasToFit, 120));
    const resizeObserver = new ResizeObserver(
      debounce(resizeCanvasToFit, 100)
    );
    resizeObserver.observe(document.querySelector(".video-wrapper"));

    // Initialize
    resizeCanvasToFit();
    addEventLog("✓ System ready", "info");
  </script>
</body>

</html>
