# =============================================================================
# Railway service config — Backend (FastAPI)
# =============================================================================
# Set "Root Directory" to /backend in Railway service settings.
# Railway will auto-detect Python via requirements.txt in this directory.

[deploy]
startCommand = "uvicorn core.app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
