# Nixpacks build config for Railway
# 1. Install system GL libraries so the full opencv-python can load if needed.
# 2. After pip resolves all deps (ultralytics pulls in opencv-python), force-swap
#    it for the headless build so libGL.so.1 is never required at import time.

[phases.setup]
aptPkgs = ["libgl1", "libglib2.0-0", "libsm6", "libxrender1", "libxext6"]

[phases.build]
cmds = [
  "pip install --force-reinstall --no-deps opencv-python-headless==4.9.0.80"
]
